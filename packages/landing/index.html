<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexo: answers your customers, hands the rest to your team</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexo answers your customers' questions from your own help pages, in a chat on your website. When it isn't sure, it passes the chat to someone on your team."
    />
    <link rel="canonical" href="https://nexo.ca/" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Cpath d='M3 14V4l12 10V4' fill='none' stroke='%233ecf8e' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexo" />
    <meta property="og:title" content="Nexo: answers your customers, hands the rest to your team" />
    <meta
      property="og:description"
      content="Nexo answers your customers' questions from your own help pages, in a chat on your website. When it isn't sure, it passes the chat to someone on your team."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexo: answers your customers, hands the rest to your team" />
    <meta
      name="twitter:description"
      content="Nexo answers your customers' questions from your own help pages, in a chat on your website. When it isn't sure, it passes the chat to someone on your team."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var stored = localStorage.getItem("nexo-theme");
        var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
