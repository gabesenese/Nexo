<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexo Widget: Embed Demo</title>
  </head>
  <body>
    <h1 style="font-family: sans-serif">Example host site</h1>
    <p style="font-family: sans-serif">
      This page embeds the widget the same way a real customer would: one script tag, served by the
      Nexo server. Build the widget once (<code>npm run build --workspace=@nexo/widget</code>) so the
      server has a bundle to serve, then open this file from any origin.
    </p>

    <script
      src="http://localhost:4000/widget.js"
      data-api-url="http://localhost:4000"
      data-org-key="legacy"
    ></script>
  </body>
</html>
