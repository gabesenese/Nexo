name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: Typecheck & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexo:nexo@localhost:5432/nexo_test?schema=public
      JWT_SECRET: ci_jwt_secret_ci_jwt_secret_ci_jwt_secret
      INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Migrate test database
        run: npx prisma migrate deploy
        working-directory: packages/server

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Test (all workspaces, incl. cross-tenant isolation)
        run: npm run test

      # Typecheck and tests never build the browser bundles, so the guards that
      # keep localhost URLs out of them were only exercised by hand or at deploy
      # time. Representative URLs here, because the property being checked is
      # that the guard runs and the output is clean, not what the values are.
      - name: Build landing and admin (production)
        run: |
          npm run build --workspace=@nexo/landing
          npm run build --workspace=@nexo/admin
        env:
          VITE_APP_URL: https://app.example.com
          VITE_API_URL: https://api.example.com

      # The assertion that actually matters. A guard can be weakened or a new
      # hardcoded fallback added without either build failing, and the result
      # looks perfect while pointing every request at the visitor's own machine.
      - name: Assert no localhost URLs shipped
        run: |
          if grep -rl "localhost" packages/landing/dist packages/admin/dist; then
            echo "::error::A production bundle contains localhost. Check the VITE_* fallbacks in the files listed above."
            exit 1
          fi
          echo "No localhost URLs in either bundle."

      # The deploy artifact. A broken Dockerfile would otherwise surface during
      # a deploy rather than on the pull request that broke it.
      - name: Build the server image
        run: docker build -t nexo-server:ci .
